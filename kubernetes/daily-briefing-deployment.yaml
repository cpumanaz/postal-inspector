apiVersion: apps/v1
kind: Deployment
metadata:
  name: daily-briefing
  namespace: postal-inspector
  labels:
    app: daily-briefing
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: daily-briefing
  template:
    metadata:
      labels:
        app: daily-briefing
    spec:
      securityContext:
        runAsUser: 5000
        runAsGroup: 5000
        fsGroup: 5000
      containers:
        - name: daily-briefing
          image: postal-inspector-daily-briefing:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef:
                name: postal-inspector-secrets
            - configMapRef:
                name: postal-inspector-config
          volumeMounts:
            - name: maildir
              mountPath: /var/mail
              readOnly: true
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          readinessProbe:
            exec:
              command: ["python", "-c", "import sys; sys.exit(0)"]
            initialDelaySeconds: 30
            periodSeconds: 30
      volumes:
        - name: maildir
          persistentVolumeClaim:
            claimName: maildir
